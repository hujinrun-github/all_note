name: Task Domain V2 Migration

on:
  workflow_dispatch:
    inputs:
      action:
        description: Operator action
        required: true
        type: choice
        options:
          - status
          - run-to-ready
          - cutover-to-v2
      workspace_id:
        description: Exact workspace ID
        required: true
        type: string
      migration_id:
        description: Stable migration ID; required for mutating actions
        required: false
        type: string
      migration_timezone:
        description: Frozen IANA timezone; required for mutating actions
        required: false
        default: Asia/Shanghai
        type: string
      confirmation:
        description: Enter RUN_TO_READY_AND_FENCE_WRITES or CUTOVER_TO_V2_AND_RETIRE_MOBILE_V1
        required: false
        type: string

concurrency:
  # Share the production lock with deploy.yml. A master push must never start
  # the backend between the offline cutover probes and the tenant CAS.
  group: deploy-production
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate request
        env:
          ACTION: ${{ inputs.action }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          MIGRATION_ID: ${{ inputs.migration_id }}
          MIGRATION_TIMEZONE: ${{ inputs.migration_timezone }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          APP_DIR: ${{ secrets.APP_DIR || vars.APP_DIR }}
        run: |
          set -eu
          : "${WORKSPACE_ID:?workspace_id is required}"
          : "${SERVER_HOST:?SERVER_HOST is required}"
          : "${SERVER_USER:?SERVER_USER is required}"
          : "${APP_DIR:?APP_DIR is required}"
          if [ -z "${SERVER_SSH_KEY:-}" ] && [ -z "${SERVER_PASSWORD:-}" ]; then
            echo "::error title=Missing deploy credential::Set SERVER_SSH_KEY or SERVER_PASSWORD."
            exit 1
          fi
          if [ "$ACTION" = "run-to-ready" ]; then
            : "${MIGRATION_ID:?migration_id is required for run-to-ready}"
            : "${MIGRATION_TIMEZONE:?migration_timezone is required for run-to-ready}"
            if [ "$CONFIRMATION" != "RUN_TO_READY_AND_FENCE_WRITES" ]; then
              echo "::error title=Confirmation required::Enter RUN_TO_READY_AND_FENCE_WRITES. This leaves the workspace at legacy/ready until a separate cutover is available."
              exit 1
            fi
          fi
          if [ "$ACTION" = "cutover-to-v2" ]; then
            : "${MIGRATION_ID:?migration_id is required for cutover-to-v2}"
            : "${MIGRATION_TIMEZONE:?migration_timezone is required for cutover-to-v2}"
            if [ "$CONFIRMATION" != "CUTOVER_TO_V2_AND_RETIRE_MOBILE_V1" ]; then
              echo "::error title=Confirmation required::Enter CUTOVER_TO_V2_AND_RETIRE_MOBILE_V1. This stops the single backend, permanently switches the workspace to task-domain v2, and retires mobile-v1 task sync/watch for that workspace."
              exit 1
            fi
          fi

      - name: Run task-domain migration operation
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.APP_DIR || vars.APP_DIR }}
          EXPECTED_SHA: ${{ github.sha }}
          ACTION: ${{ inputs.action }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          MIGRATION_ID: ${{ inputs.migration_id }}
          MIGRATION_TIMEZONE: ${{ inputs.migration_timezone }}
        with:
          host: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || '22' }}
          command_timeout: 70m
          envs: APP_DIR,EXPECTED_SHA,ACTION,WORKSPACE_ID,MIGRATION_ID,MIGRATION_TIMEZONE
          script: |
            set -eu
            : "${APP_DIR:?APP_DIR is required}"
            cd "$APP_DIR"

            deployed_sha="$(git rev-parse HEAD)"
            if [ "$deployed_sha" != "$EXPECTED_SHA" ]; then
              echo "Refusing migration: deployed commit $deployed_sha does not match workflow commit $EXPECTED_SHA."
              exit 1
            fi

            if [ "$ACTION" = "status" ]; then
              docker compose run --rm --no-deps backend \
                flowspace-admin task-migration-status \
                --workspace-id "$WORKSPACE_ID"
              exit 0
            fi

            run_to_ready() {
              docker compose run --rm --no-deps backend \
                flowspace-admin task-migration-run-to-ready \
                --workspace-id "$WORKSPACE_ID" \
                --migration-id "$MIGRATION_ID" \
                --migration-timezone "$MIGRATION_TIMEZONE" \
                --confirm-fence-legacy-writes
            }

            status() {
              docker compose run --rm --no-deps backend \
                flowspace-admin task-migration-status \
                --workspace-id "$WORKSPACE_ID"
            }

            if [ "$ACTION" = "run-to-ready" ]; then
              run_to_ready
              status
              exit 0
            fi

            mobile_v2_probe="$(
              docker compose exec -T backend \
                wget -S -O /dev/null http://127.0.0.1:4201/api/mobile/v2/capabilities 2>&1 || true
            )"
            printf '%s\n' "$mobile_v2_probe"
            if ! printf '%s\n' "$mobile_v2_probe" | grep -Eq 'HTTP/[0-9.]+ 401'; then
              echo "Refusing cutover: the deployed backend does not expose the authenticated /api/mobile/v2/capabilities route."
              exit 1
            fi

            services_stopped=1
            restart_services() {
              if [ "$services_stopped" = "1" ]; then
                services_stopped=0
                docker compose up -d --no-deps --wait backend frontend || true
              fi
            }
            trap restart_services EXIT
            trap 'restart_services; exit 129' HUP
            trap 'restart_services; exit 130' INT
            trap 'restart_services; exit 143' TERM

            docker compose stop frontend backend

            operation_status=0
            run_to_ready || operation_status=$?
            if [ "$operation_status" -eq 0 ]; then
              docker compose run --rm --no-deps backend \
                flowspace-admin task-migration-cutover \
                --workspace-id "$WORKSPACE_ID" \
                --migration-id "$MIGRATION_ID" \
                --confirm-backend-offline \
                --confirm-retire-mobile-v1-task-api \
                --confirm-irreversible-cutover || operation_status=$?
            fi
            if [ "$operation_status" -eq 0 ]; then
              status || operation_status=$?
            fi

            restart_status=0
            if docker compose up -d --no-deps --wait backend frontend; then
              services_stopped=0
            else
              restart_status=$?
            fi
            trap - HUP INT TERM

            if [ "$operation_status" -ne 0 ]; then
              echo "Task-domain v2 cutover failed with status $operation_status. Services were restarted; task routes remain fail-closed if the tenant/control epoch sync did not complete."
              exit "$operation_status"
            fi
            if [ "$restart_status" -ne 0 ]; then
              echo "Task-domain v2 cutover completed, but service restart failed with status $restart_status."
              docker compose ps || true
              docker compose logs --tail=200 backend || true
              exit "$restart_status"
            fi

            trap - EXIT
            docker compose ps
